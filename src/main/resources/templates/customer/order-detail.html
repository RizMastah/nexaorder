<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer-layout :: customerLayout('Order Detail', ~{::section})}">
<body>
<section class="space-y-6" x-data="{ cancelOpen: false }">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div>
            <a th:href="@{/customer/orders}" class="inline-flex text-sm font-semibold text-emerald-700 transition hover:text-emerald-800">
                Back to orders
            </a>
            <h2 class="mt-3 text-2xl font-semibold text-slate-950" th:text="${'Order #' + order.id}">Order #1</h2>
            <p class="mt-2 text-sm text-slate-600"
               th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">01 Jun 2026 10:00</p>
        </div>
        <span th:replace="~{fragments/status-badge :: statusBadge(${order.status.name()})}">PENDING</span>
    </div>

    <div th:if="${successMessage}" class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-800">
        <span th:text="${successMessage}">Order updated.</span>
    </div>
    <div th:if="${errorMessage}" class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
        <span th:text="${errorMessage}">Order error.</span>
    </div>

    <div class="grid gap-6 xl:grid-cols-[minmax(0,1fr)_360px]">
        <div data-animate="order-summary" class="nexa-card overflow-hidden">
            <div class="border-b border-slate-200 px-5 py-4">
                <h3 class="text-base font-semibold text-slate-950">Order Items</h3>
            </div>
            <div class="divide-y divide-slate-100">
                <article th:each="item : ${order.items}" class="flex gap-4 p-5">
                    <img th:if="${item.productImageUrl != null and item.productImageUrl != ''}"
                         th:src="@{${item.productImageUrl}}"
                         th:alt="${item.productName}"
                         class="h-16 w-16 rounded-xl object-cover ring-1 ring-slate-200">
                    <div th:unless="${item.productImageUrl != null and item.productImageUrl != ''}"
                         class="flex h-16 w-16 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-sm font-bold text-slate-500 ring-1 ring-slate-200"
                         th:text="${#strings.substring(item.productName, 0, 1)}">P</div>
                    <div class="min-w-0 flex-1">
                        <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
                            <div>
                                <h4 class="text-sm font-semibold text-slate-950" th:text="${item.productName}">Product</h4>
                                <p class="mt-1 text-xs font-medium text-slate-500" th:text="${item.productCategory}">Category</p>
                            </div>
                            <p class="text-sm font-semibold text-slate-950"
                               th:text="${'Rp ' + #numbers.formatDecimal(item.subtotal, 0, 'COMMA', 2, 'POINT')}">Rp 0.00</p>
                        </div>
                        <p class="mt-2 text-sm text-slate-600">
                            <span th:text="${item.quantity}">1</span>
                            <span> x </span>
                            <span th:text="${'Rp ' + #numbers.formatDecimal(item.price, 0, 'COMMA', 2, 'POINT')}">Rp 0.00</span>
                        </p>
                    </div>
                </article>
            </div>
        </div>

        <aside class="space-y-4">
            <div data-animate="order-summary" class="nexa-card p-6">
                <h3 class="text-base font-semibold text-slate-950">Summary</h3>
                <div class="mt-5 space-y-4 text-sm">
                    <div class="flex items-center justify-between">
                        <span class="text-slate-500">Status</span>
                        <span class="font-semibold text-slate-950" th:text="${order.status}">PENDING</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-slate-500">Items</span>
                        <span class="font-semibold text-slate-950" th:text="${#lists.size(order.items)}">1</span>
                    </div>
                    <div class="border-t border-slate-100 pt-4">
                        <div class="flex items-center justify-between">
                            <span class="font-semibold text-slate-700">Total</span>
                            <span class="text-lg font-semibold text-slate-950"
                                  th:text="${'Rp ' + #numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 2, 'POINT')}">Rp 0.00</span>
                        </div>
                    </div>
                </div>
                <button th:if="${order.cancellable}"
                        type="button"
                        class="mt-6 w-full rounded-xl bg-red-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-red-700"
                        @click="cancelOpen = true">
                    Cancel Order
                </button>
            </div>

            <div data-animate="order-summary" class="nexa-card p-6">
                <h3 class="text-base font-semibold text-slate-950">Status Timeline</h3>
                <div class="mt-5 space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="h-3 w-3 rounded-full bg-emerald-600"></span>
                        <span class="text-sm font-semibold text-slate-950">Pending</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="h-3 w-3 rounded-full bg-slate-300"></span>
                        <span class="text-sm font-medium text-slate-500">Paid</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="h-3 w-3 rounded-full bg-slate-300"></span>
                        <span class="text-sm font-medium text-slate-500">Processing</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="h-3 w-3 rounded-full bg-slate-300"></span>
                        <span class="text-sm font-medium text-slate-500">Completed</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <div x-cloak
         x-show="cancelOpen"
         x-transition.opacity
         class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 px-4">
        <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-xl"
                 @click.outside="cancelOpen = false">
            <h3 class="text-lg font-semibold text-slate-950">Cancel order</h3>
            <p class="mt-2 text-sm leading-6 text-slate-600">Cancel this pending order?</p>
            <form th:action="@{/customer/orders/{id}/cancel(id=${order.id})}" method="post" class="mt-6 flex justify-end gap-3">
                <button type="button" class="nexa-btn-secondary" @click="cancelOpen = false">Keep order</button>
                <button type="submit" class="rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-red-700">
                    Cancel Order
                </button>
            </form>
        </section>
    </div>
</section>
</body>
</html>
