<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth-layout :: authLayout('Login', ~{::section})}">
<body>
<section x-data="nexaAuth()">
    <div class="mb-6">
        <p class="nexa-section-label">Secure Access</p>
        <h1 class="mt-2 text-[2rem] font-bold leading-tight tracking-[-0.04em] text-slate-950">Sign in to NexaOrder</h1>
        <p class="mt-2 text-sm leading-6 text-slate-600">
            Continue to the dashboard to manage orders, payments, stock, reports, and invoices.
        </p>
    </div>

    <div th:if="${successMessage}"
         class="mb-5 rounded-2xl border border-emerald-100 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-800"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="mb-5 rounded-2xl border border-red-100 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700"
         th:text="${errorMessage}">
    </div>

    <form class="space-y-4" th:action="@{/auth/login}" th:object="${loginRequest}" method="post">
        <div>
            <label for="email" class="mb-2 block text-sm font-bold text-slate-700">Email address</label>
            <input id="email"
                   type="email"
                   th:field="*{email}"
                   class="nexa-auth-input"
                   placeholder="admin@nexaorder.com"
                   autocomplete="email">
            <p class="mt-2 text-sm font-medium text-red-600" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div>
            <div class="mb-2 flex items-center justify-between gap-3">
                <label for="password" class="block text-sm font-bold text-slate-700">Password</label>
                <button type="button"
                        class="text-sm font-bold text-teal-700 transition hover:text-teal-800"
                        @click="showPassword = !showPassword"
                        x-text="showPassword ? 'Hide' : 'Show'">
                </button>
            </div>
            <input id="password"
                   th:field="*{password}"
                   :type="showPassword ? 'text' : 'password'"
                   class="nexa-auth-input"
                   placeholder="Enter your password"
                   autocomplete="current-password">
            <p class="mt-2 text-sm font-medium text-red-600" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <button type="submit" class="nexa-auth-primary mt-2 w-full">
            Sign in
        </button>
    </form>

    <div class="mt-5 rounded-2xl bg-slate-50 px-4 py-3 text-sm leading-6 text-slate-600 ring-1 ring-slate-100">
        Use the account assigned for your role. Admin and customer workspaces are separated after sign-in.
    </div>

    <p class="mt-5 text-center text-sm text-slate-600">
        New customer?
        <a th:href="@{/auth/register}" class="font-bold text-teal-700 transition hover:text-teal-800">Create an account</a>
    </p>
</section>
</body>
</html>
