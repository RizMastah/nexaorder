<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth-layout :: authLayout('Register', ~{::section})}">
<body>
<section id="auth-card"
         data-animate="auth-card"
         class="nexa-card p-8"
         x-data="nexaAuth()">
    <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-emerald-600 text-lg font-bold text-white">
            N
        </div>
        <p class="text-sm font-semibold uppercase tracking-wide text-emerald-700">NexaOrder</p>
        <h1 class="mt-2 text-2xl font-semibold text-slate-950">Create customer account</h1>
        <p class="mt-2 text-sm leading-6 text-slate-500">Register to start managing your orders.</p>
    </div>

    <div th:if="${errorMessage}"
         class="mb-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"
         th:text="${errorMessage}">
    </div>

    <form class="space-y-5" th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
        <div>
            <label for="name" class="mb-2 block text-sm font-semibold text-slate-700">Name</label>
            <input id="name"
                   type="text"
                   th:field="*{name}"
                   class="nexa-input"
                   placeholder="Your name">
            <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div>
            <label for="email" class="mb-2 block text-sm font-semibold text-slate-700">Email</label>
            <input id="email"
                   type="email"
                   th:field="*{email}"
                   class="nexa-input"
                   placeholder="customer@example.com">
            <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div>
            <label for="password" class="mb-2 block text-sm font-semibold text-slate-700">Password</label>
            <div class="relative">
                <input id="password"
                       th:field="*{password}"
                       :type="showPassword ? 'text' : 'password'"
                       class="nexa-input pr-20"
                       placeholder="Minimum 6 characters">
                <button type="button"
                        class="absolute inset-y-0 right-0 px-4 text-sm font-semibold text-emerald-700 transition hover:text-emerald-800"
                        @click="showPassword = !showPassword"
                        x-text="showPassword ? 'Hide' : 'Show'">
                </button>
            </div>
            <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div>
            <label for="confirmPassword" class="mb-2 block text-sm font-semibold text-slate-700">Confirm Password</label>
            <div class="relative">
                <input id="confirmPassword"
                       th:field="*{confirmPassword}"
                       :type="showConfirmPassword ? 'text' : 'password'"
                       class="nexa-input pr-20"
                       placeholder="Repeat your password">
                <button type="button"
                        class="absolute inset-y-0 right-0 px-4 text-sm font-semibold text-emerald-700 transition hover:text-emerald-800"
                        @click="showConfirmPassword = !showConfirmPassword"
                        x-text="showConfirmPassword ? 'Hide' : 'Show'">
                </button>
            </div>
            <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
        </div>

        <button type="submit" class="nexa-btn-primary w-full">
            Register
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
        Already registered?
        <a th:href="@{/auth/login}" class="font-semibold text-emerald-700 transition hover:text-emerald-800">Sign in</a>
    </p>
</section>
</body>
</html>
