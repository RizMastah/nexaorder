<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaOrder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
<main class="flex min-h-screen items-center justify-center px-6 py-12">
    <section class="w-full max-w-3xl rounded-2xl border border-slate-200 bg-white p-8 shadow-sm sm:p-10"
             x-data
             id="home-card">
        <div class="mb-8 flex items-center gap-3">
            <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-emerald-600 text-lg font-bold text-white">
                N
            </div>
            <div>
                <p class="text-sm font-medium uppercase tracking-wide text-emerald-700">NexaOrder</p>
                <h1 class="text-2xl font-semibold text-slate-950 sm:text-3xl">Spring Boot + Thymeleaf is running successfully.</h1>
            </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-3">
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
                <p class="text-sm font-medium text-slate-500">Backend</p>
                <p class="mt-1 font-semibold text-slate-900">Spring Boot</p>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
                <p class="text-sm font-medium text-slate-500">Template</p>
                <p class="mt-1 font-semibold text-slate-900">Thymeleaf</p>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
                <p class="text-sm font-medium text-slate-500">UI</p>
                <p class="mt-1 font-semibold text-slate-900">Tailwind + Flowbite</p>
            </div>
        </div>

        <div class="mt-8 flex flex-col gap-3 border-t border-slate-200 pt-6 sm:flex-row sm:items-center sm:justify-between">
            <p class="text-sm text-slate-600">Initial setup page for the NexaOrder order management dashboard.</p>
            <a href="/auth/login"
               class="inline-flex items-center justify-center rounded-lg bg-emerald-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-200">
                Go to Login
            </a>
        </div>
    </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    window.addEventListener("DOMContentLoaded", function () {
        if (window.gsap) {
            gsap.from("#home-card", {
                duration: 0.45,
                y: 18,
                opacity: 0,
                ease: "power2.out"
            });
        }
    });
</script>
</body>
</html>
