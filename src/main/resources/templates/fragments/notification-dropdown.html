<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="notificationDropdown" class="relative">
    <button type="button"
            class="relative inline-flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 transition hover:bg-slate-50"
            @click="notificationsOpen = !notificationsOpen; profileOpen = false"
            aria-label="Notifications">
        <span class="text-base font-semibold">!</span>
        <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-emerald-500"></span>
    </button>

    <div x-cloak
         x-show="notificationsOpen"
         @click.outside="notificationsOpen = false"
         x-transition.opacity
         class="absolute right-0 mt-2 w-80 rounded-xl border border-slate-200 bg-white p-3 shadow-lg">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <p class="text-sm font-semibold text-slate-950">Notifications</p>
            <span class="rounded-full bg-slate-100 px-2 py-1 text-xs font-medium text-slate-600">Preview</span>
        </div>
        <div class="py-4 text-sm text-slate-600">
            No notification data is loaded yet.
        </div>
    </div>
</div>
</body>
</html>
