<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<span th:fragment="paymentBadge(status)"
      class="inline-flex rounded-full px-2.5 py-1 text-xs font-semibold"
      th:classappend="${status == 'PENDING'} ? ' bg-amber-100 text-amber-800' :
        (${status == 'WAITING_CONFIRMATION'} ? ' bg-sky-100 text-sky-800' :
        (${status == 'PAID'} ? ' bg-emerald-100 text-emerald-800' :
        (${status == 'FAILED'} ? ' bg-red-100 text-red-700' : ' bg-slate-100 text-slate-700')))"
      th:text="${status}">PENDING</span>
</body>
</html>
