<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="confirmModal(title, message)"
     x-cloak
     x-show="confirmModalOpen"
     x-transition.opacity
     class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 px-4">
    <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-xl"
             @click.outside="confirmModalOpen = false">
        <h2 class="text-lg font-semibold text-slate-950" th:text="${title}">Confirm action</h2>
        <p class="mt-2 text-sm leading-6 text-slate-600" th:text="${message}">Please confirm this action.</p>
        <div class="mt-6 flex justify-end gap-3">
            <button type="button"
                    class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
                    @click="confirmModalOpen = false">
                Cancel
            </button>
            <button type="submit"
                    class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-700">
                Confirm
            </button>
        </div>
    </section>
</div>
</body>
</html>
