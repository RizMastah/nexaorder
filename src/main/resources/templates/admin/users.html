<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: adminLayout('Users', ~{::section})}">
<body>
<section class="space-y-6">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div>
            <p class="text-sm font-semibold uppercase tracking-wide text-emerald-700">User Management</p>
            <h2 class="mt-2 text-2xl font-semibold text-slate-950">Users</h2>
            <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600">
                Review registered admin and customer accounts for the NexaOrder workspace.
            </p>
        </div>
    </div>

    <div class="grid gap-4 sm:grid-cols-3">
        <article class="nexa-card p-5">
            <p class="text-sm font-semibold text-slate-500">Total Users</p>
            <p class="mt-3 text-3xl font-semibold text-slate-950" th:text="${#lists.size(users)}">0</p>
        </article>
        <article class="nexa-card p-5">
            <p class="text-sm font-semibold text-slate-500">Admins</p>
            <p class="mt-3 text-3xl font-semibold text-emerald-700" th:text="${adminCount}">0</p>
        </article>
        <article class="nexa-card p-5">
            <p class="text-sm font-semibold text-slate-500">Customers</p>
            <p class="mt-3 text-3xl font-semibold text-slate-950" th:text="${customerCount}">0</p>
        </article>
    </div>

    <div class="nexa-card overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                <tr>
                    <th scope="col" class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">User</th>
                    <th scope="col" class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Role</th>
                    <th scope="col" class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Created</th>
                    <th scope="col" class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Updated</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 bg-white">
                <tr th:each="user : ${users}" class="transition hover:bg-slate-50">
                    <td class="px-5 py-4">
                        <p class="text-sm font-semibold text-slate-950" th:text="${user.name}">NexaOrder User</p>
                        <p class="mt-1 text-xs text-slate-500" th:text="${user.email}">user@nexaorder.com</p>
                    </td>
                    <td class="px-5 py-4">
                        <span class="inline-flex rounded-full px-2.5 py-1 text-xs font-semibold"
                              th:classappend="${user.role.name() == 'ADMIN'} ? ' bg-emerald-100 text-emerald-800' : ' bg-slate-100 text-slate-700'"
                              th:text="${user.role}">CUSTOMER</span>
                    </td>
                    <td class="whitespace-nowrap px-5 py-4 text-sm text-slate-600"
                        th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy HH:mm')}">01 Jun 2026 10:00</td>
                    <td class="whitespace-nowrap px-5 py-4 text-sm text-slate-600"
                        th:text="${#temporals.format(user.updatedAt, 'dd MMM yyyy HH:mm')}">01 Jun 2026 10:00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="4" class="px-5 py-10 text-center text-sm font-medium text-slate-500">
                        No users have been registered yet.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
