<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: adminLayout(${pageTitle}, ~{::section})}">
<body>
<section class="space-y-6">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div>
            <p class="text-sm font-semibold uppercase tracking-wide text-emerald-700">Product Setup</p>
            <h2 class="mt-2 text-2xl font-semibold text-slate-950" th:text="${pageTitle}">Product Form</h2>
            <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600">
                Keep product information clear so customers can scan the catalog quickly.
            </p>
        </div>
        <a th:href="@{/admin/products}" class="nexa-btn-secondary">Back to products</a>
    </div>

    <form data-animate="product-form"
          th:action="@{${formAction}}"
          th:object="${productRequest}"
          method="post"
          enctype="multipart/form-data"
          class="grid gap-6 xl:grid-cols-[1fr_360px]">
        <div class="nexa-card p-6">
            <div th:if="${#fields.hasGlobalErrors()}" class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">Unable to save product.</p>
            </div>

            <div class="grid gap-5 sm:grid-cols-2">
                <div class="sm:col-span-2">
                    <label for="name" class="mb-2 block text-sm font-semibold text-slate-700">Product name</label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           class="nexa-input"
                           th:classappend="${#fields.hasErrors('name')} ? ' border-red-300' : ''"
                           placeholder="Wireless Mouse">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-2 text-sm font-medium text-red-600">Name error</p>
                </div>

                <div>
                    <label for="category" class="mb-2 block text-sm font-semibold text-slate-700">Category</label>
                    <input id="category"
                           type="text"
                           list="category-options"
                           th:field="*{category}"
                           class="nexa-input"
                           th:classappend="${#fields.hasErrors('category')} ? ' border-red-300' : ''"
                           placeholder="Electronics">
                    <datalist id="category-options">
                        <option th:each="categoryName : ${categories}" th:value="${categoryName}"></option>
                    </datalist>
                    <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="mt-2 text-sm font-medium text-red-600">Category error</p>
                </div>

                <div>
                    <label for="price" class="mb-2 block text-sm font-semibold text-slate-700">Price</label>
                    <input id="price"
                           type="number"
                           step="0.01"
                           min="0"
                           th:field="*{price}"
                           class="nexa-input"
                           th:classappend="${#fields.hasErrors('price')} ? ' border-red-300' : ''"
                           placeholder="129000">
                    <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="mt-2 text-sm font-medium text-red-600">Price error</p>
                </div>

                <div>
                    <label for="stock" class="mb-2 block text-sm font-semibold text-slate-700">Stock</label>
                    <input id="stock"
                           type="number"
                           min="0"
                           th:field="*{stock}"
                           class="nexa-input"
                           th:classappend="${#fields.hasErrors('stock')} ? ' border-red-300' : ''"
                           placeholder="24">
                    <p th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}" class="mt-2 text-sm font-medium text-red-600">Stock error</p>
                </div>

                <div class="sm:col-span-2">
                    <label for="description" class="mb-2 block text-sm font-semibold text-slate-700">Description</label>
                    <textarea id="description"
                              rows="5"
                              th:field="*{description}"
                              class="nexa-input"
                              th:classappend="${#fields.hasErrors('description')} ? ' border-red-300' : ''"
                              placeholder="Product details for the catalog"></textarea>
                    <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="mt-2 text-sm font-medium text-red-600">Description error</p>
                </div>
            </div>

            <div class="mt-6 flex flex-col-reverse gap-3 border-t border-slate-100 pt-6 sm:flex-row sm:justify-end">
                <a th:href="@{/admin/products}" class="nexa-btn-secondary">Cancel</a>
                <button type="submit" class="nexa-btn-primary" th:text="${submitText}">Save product</button>
            </div>
        </div>

        <aside class="nexa-card p-6"
               x-data="productImagePreview($el.dataset.initialImage)"
               th:data-initial-image="${existingProduct != null ? existingProduct.imageUrl : ''}">
            <label for="imageFile" class="mb-2 block text-sm font-semibold text-slate-700">Product image</label>
            <div class="overflow-hidden rounded-2xl border border-slate-200 bg-slate-50">
                <img x-show="previewUrl"
                     :src="previewUrl"
                     alt="Product image preview"
                     class="h-64 w-full object-cover">
                <div x-show="!previewUrl"
                     class="flex h-64 w-full items-center justify-center px-6 text-center">
                    <div>
                        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-white text-lg font-bold text-slate-400 ring-1 ring-slate-200">
                            N
                        </div>
                        <p class="mt-3 text-sm font-medium text-slate-500">No image selected</p>
                    </div>
                </div>
            </div>
            <input id="imageFile"
                   type="file"
                   th:field="*{imageFile}"
                   accept="image/png,image/jpeg,image/webp,image/gif"
                   class="mt-4 block w-full text-sm text-slate-600 file:mr-4 file:rounded-xl file:border-0 file:bg-emerald-50 file:px-4 file:py-2.5 file:text-sm file:font-semibold file:text-emerald-700 hover:file:bg-emerald-100"
                   @change="previewImage($event)">
            <p class="mt-3 text-xs leading-5 text-slate-500">JPG, PNG, WEBP, or GIF. Maximum size 5 MB.</p>
        </aside>
    </form>
</section>
</body>
</html>
